model:
  hidden_dim: 64
  num_heads: 4
  vlm:
    backend: tiny
    tiny_dim: 32
    dtype: float32
  graph:
    layers: 2
    max_nodes: 16
    relation_loss_weight: 0.0
    target_loss_weight: 0.25
  action:
    condition_on_target: true
    dim: 2
    state_dim: 2
    horizon: 4
    execute_steps: 1
    layers: 2
    inference_steps: 3
training:
  manifest: runs/graph-reach/corrections/manifest.json
  output_dir: runs/graph-reach/posttrained
  batch_size: 16
  max_steps: 600
  learning_rate: 0.0004
  warmup_steps: 20
  ema_decay: 0.97
  log_every: 100
  checkpoint_every: 200
  num_workers: 0

model:
  hidden_dim: 64
  num_heads: 4
  vlm:
    backend: tiny
    tiny_dim: 32
    dtype: float32
  graph:
    layers: 2
    max_nodes: 16
    relation_loss_weight: 0.0
    target_loss_weight: 0.25
  action:
    dim: 2
    state_dim: 2
    horizon: 4
    execute_steps: 1
    layers: 2
    inference_steps: 3
training:
  manifest: runs/graph-reach/data/manifest.json
  output_dir: runs/graph-reach/checkpoints
  batch_size: 16
  max_steps: 1200
  learning_rate: 0.001
  warmup_steps: 15
  ema_decay: 0.97
  log_every: 50
  checkpoint_every: 100
  num_workers: 0

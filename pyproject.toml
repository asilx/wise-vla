[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wise-vla"
version = "0.1.0"
description = "Knowledge-graph-native flow-matching vision-language-action policy for Grounded Forge"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Grounded Forge"}]
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
vlm = ["transformers==4.57.6", "accelerate>=1.0,<2", "safetensors>=0.4", "torchvision>=0.20,<0.23"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
wise-vla-train = "wise_vla.train:main"
wise-vla-eval = "wise_vla.evaluate:main"
wise-vla-demo = "wise_vla.demo:main"
wise-vla-stats = "wise_vla.data.normalization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires locally cached pretrained Qwen3-VL weights"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
